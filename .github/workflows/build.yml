name: Build C++ EXE

on:
  push:
    branches: [ "main" ] # Runs every time you push or merge code to main

jobs:
  build:
    runs-on: windows-latest # Required to build a Windows native .exe

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Recommended since you have a "third_party" folder

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Windows-Binary
        # This grabs any .exe file generated in your build directory
        path: ${{github.workspace}}/build/**/*.exe 
